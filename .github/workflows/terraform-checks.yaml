name: Terraform checks

on:
  pull_request:
  push:
    branches: [ main ]
permissions: read-all

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Gitleaks scans a commit range and needs full history
        # 0 = fetch all history for all branches and tags, as in git clone
        fetch-depth: 0 

    # -----------------------------
    # Terraform
    # -----------------------------
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.3
        terraform_wrapper: false
    # Formatting consistency
    - name: Terraform format check
      run: terraform fmt -check -recursive

    # Syntax & provider correctness
    - name: Terraform validate
      run: |
        find . -type f -name "*.tf" -not -path "./modules/*" -print0 \
        | xargs -0 -n1 dirname \
        | sort -u \
        | while read dir; do
            echo "Validating $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

    # -----------------------------
    # TFLint
    # -----------------------------
    #Terraform & provider best practices
    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v6
      with:
        tflint_version: v0.66.0

    - name: TFLint
      run: |
        tflint --init
        tflint --recursive

    # -----------------------------
    # Checkov (IaC security scanning)
    # -----------------------------
    - name: Run Checkov
      uses: bridgecrewio/checkov-action@v12
      with:
        quiet: true
        framework: terraform
        # write SARIF to a distinct file: Gitleaks action always writes results.sarif
        output_format: cli,sarif
        output_file_path: console,checkov.sarif

    # -----------------------------
    # Secret scanning
    # -----------------------------
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
